name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project uptrack.xcodeproj \
            -scheme uptrack

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -project uptrack.xcodeproj \
            -scheme uptrack \
            -configuration Debug \
            -resultBundlePath build/uptrack.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tail -100

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uptrack.xcresult
          path: build/uptrack.xcresult

  lint:
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftFormat
        # Pinned so lint results match local runs; the runner image's own
        # swiftformat (or brew's latest) can enable different default rules.
        env:
          SWIFTFORMAT_VERSION: 0.62.1
        run: |
          curl -fsSL -o swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -o -q swiftformat.zip -d /tmp/swiftformat
          chmod +x /tmp/swiftformat/swiftformat
          /tmp/swiftformat/swiftformat --version

      - name: Lint
        run: /tmp/swiftformat/swiftformat --lint .
